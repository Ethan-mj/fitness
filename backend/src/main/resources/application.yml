server:
  port: ${SERVER_PORT:8080}
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/fitness;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
app:
  seed-enabled: ${SEED_ENABLED:true}
  admin:
    initial-password: ${ADMIN_INITIAL_PASSWORD:Fit@2026}
  jwt:
    secret: ${JWT_SECRET:replace-this-with-at-least-32-characters-before-production}
    expiration: 7d
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
