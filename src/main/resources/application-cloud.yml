server:
  port: ${SERVER_PORT:80}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_ADDRESS}/${MYSQL_DATABASE:fitness}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

app:
  seed-enabled: ${SEED_ENABLED:false}
  admin:
    initialize-enabled: ${ADMIN_INITIALIZE_ENABLED:true}
    initial-password: ${ADMIN_INITIAL_PASSWORD}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:*}
